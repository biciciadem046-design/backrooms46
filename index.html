<script type="module">

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

/* =====================================================
   BASIC
===================================================== */

const $ = id => document.getElementById(id);

let scene;
let camera;
let renderer;

let clock;

let gameStarted = false;

let audioContext = null;

let flashlight;
let flashlightOn = false;

let cameraYaw = 0;
let cameraPitch = 0;

let sensitivity =
  Number(localStorage.getItem("cameraSensitivity")) || 1;

let level = 0;

let health = 100;
let stamina = 100;
let battery = 100;

let footstepTimer = null;
let currentFootstepMode = null;

let entity = null;

let doors = [];

let objects = [];

let noteObjects = [];

let currentNote = null;

let player = {

  running:false,
  hidden:false

};

let joy = {

  x:0,
  y:0

};

let keys = {

  w:false,
  a:false,
  s:false,
  d:false,
  shift:false

};

/* =====================================================
   START
===================================================== */

$("startButton").addEventListener(
  "click",
  async () => {

    $("startScreen").style.display = "none";

    gameStarted = true;

    await requestFullscreen();

    initAudio();

    createGame();

    setupKeyboard();

    setupMobile();

    updateMobileLayout();

    buildLevel(0);

    showMessage(
      "LEVEL 0 — ANAHTARI BUL",
      3000
    );

  }
);

/* =====================================================
   FULLSCREEN
===================================================== */

async function requestFullscreen(){

  try{

    if(document.documentElement.requestFullscreen){

      await document.documentElement.requestFullscreen();

    }

  }catch(e){}

  try{

    if(screen.orientation &&
       screen.orientation.lock){

      await screen.orientation.lock("landscape");

    }

  }catch(e){}

}

/* =====================================================
   AUDIO
===================================================== */

function initAudio(){

  if(audioContext) return;

  audioContext =
    new (window.AudioContext ||
         window.webkitAudioContext)();

}

function soundTone(
  frequency,
  duration,
  volume,
  type="sine"
){

  if(!audioContext) return;

  const oscillator =
    audioContext.createOscillator();

  const gain =
    audioContext.createGain();

  oscillator.type = type;

  oscillator.frequency.value =
    frequency;

  gain.gain.value =
    volume;

  oscillator.connect(gain);

  gain.connect(
    audioContext.destination
  );

  oscillator.start();

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audioContext.currentTime + duration
  );

  oscillator.stop(
    audioContext.currentTime + duration
  );

}

function doorSound(){

  soundTone(80,.3,.12,"sawtooth");

}

function pickupSound(){

  soundTone(600,.08,.08);

  setTimeout(
    ()=>soundTone(850,.1,.06),
    70
  );

}

function jumpscareSound(){

  soundTone(45,.8,.3,"sawtooth");

  setTimeout(
    ()=>soundTone(180,.5,.2,"square"),
    100
  );

}

/* =====================================================
   FOOTSTEPS
===================================================== */

function footsteps(running){

  if(currentFootstepMode ===
     (running ? "run":"walk")){

    return;

  }

  stopFootsteps();

  currentFootstepMode =
    running ? "run":"walk";

  const interval =
    running ? 250:430;

  const frequency =
    running ? 70:105;

  const volume =
    running ? .13:.07;

  soundTone(
    frequency,
    .08,
    volume,
    "triangle"
  );

  footstepTimer =
    setInterval(
      ()=>{

        soundTone(
          frequency,
          .08,
          volume,
          "triangle"
        );

      },
      interval
    );

}

function stopFootsteps(){

  if(footstepTimer !== null){

    clearInterval(
      footstepTimer
    );

    footstepTimer = null;

  }

  currentFootstepMode = null;

}

/* =====================================================
   GAME CREATE
===================================================== */

function createGame(){

  scene =
    new THREE.Scene();

  scene.background =
    new THREE.Color(
      0x171208
    );

  scene.fog =
    new THREE.Fog(
      0x171208,
      20,
      65
    );

  camera =
    new THREE.PerspectiveCamera(
      75,
      innerWidth / innerHeight,
      .05,
      200
    );

  camera.position.set(
    0,
    1.65,
    8
  );

  renderer =
    new THREE.WebGLRenderer({
      antialias:true
    });

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(
      devicePixelRatio,
      1.5
    )
  );

  document.body.appendChild(
    renderer.domElement
  );

  clock =
    new THREE.Clock();

  /* LIGHT */

  const ambient =
    new THREE.AmbientLight(
      0xffe6a3,
      .28
    );

  scene.add(
    ambient
  );

  /* FLOOR */

  const floor =
    new THREE.Mesh(

      new THREE.PlaneGeometry(
        120,
        120
      ),

      new THREE.MeshStandardMaterial({
        color:0x4d431e,
        roughness:1
      })

    );

  floor.rotation.x =
    -Math.PI/2;

  floor.position.y = 0;

  scene.add(floor);

  /* FLASHLIGHT */

  flashlight =
    new THREE.SpotLight(
      0xffffdf,
      0,
      30,
      Math.PI/8,
      .55,
      1
    );

  flashlight.position.set(
    0,
    1.55,
    0
  );

  flashlight.target.position.set(
    0,
    1.5,
    -10
  );

  camera.add(
    flashlight
  );

  camera.add(
    flashlight.target
  );

  scene.add(camera);

  window.addEventListener(
    "resize",
    onResize
  );

  animate();

}

/* =====================================================
   LEVEL
===================================================== */

function clearLevel(){

  doors = [];

  objects = [];

  noteObjects = [];

  entity = null;

  for(
    const child of [...scene.children]
  ){

    if(
      child.userData &&
      child.userData.levelObject
    ){

      scene.remove(child);

    }

  }

}

function buildLevel(number){

  level = number;

  clearLevel();

  camera.position.set(
    0,
    1.65,
    8
  );

  cameraYaw = 0;

  cameraPitch = 0;

  $("levelText").textContent =
    "LEVEL " + number;

  if(number === 0){

    buildLevel0();

  }

  else if(number === 1){

    buildLevel1();

  }

  else{

    buildLevel2();

  }

}

/* =====================================================
   WALL
===================================================== */

function wall(
  x,
  z,
  width,
  depth,
  height=3
){

  const mesh =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        width,
        height,
        depth
      ),

      new THREE.MeshStandardMaterial({
        color:0x706229,
        roughness:1
      })

    );

  mesh.position.set(
    x,
    height/2,
    z
  );

  mesh.userData.levelObject =
    true;

  mesh.userData.wall =
    true;

  scene.add(mesh);

  objects.push(mesh);

  return mesh;

}

   LEVEL 0
===================================================== */

/* =====================================================
   DOOR
===================================================== */

function createDoor(
  x,
  z,
  rotation,
  doorLevel
){

  const pivot =
    new THREE.Group();

  pivot.position.set(
    x,
    0,
    z
  );

  pivot.rotation.y =
    rotation;

  pivot.userData.levelObject =
    true;

  pivot.userData.door =
    true;

  pivot.userData.open =
    false;

  const mesh =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        2.8,
        3,
        .25
      ),

      new THREE.MeshStandardMaterial({
        color:0x22201a
      })

    );

  mesh.position.set(
    1.4,
    1.5,
    0
  );

  pivot.add(mesh);

  scene.add(pivot);

  doors.push({
    pivot,
    level:doorLevel,
    target:0
  });

}

/* =====================================================
   KEY
===================================================== */

function createKey(
  x,
  y,
  z
){

  const key =
    new THREE.Mesh(

      new THREE.TorusGeometry(
        .18,
        .045,
        8,
        20

/* =====================================================
   KEYBOARD
===================================================== */

function setupKeyboard(){

  window.addEventListener(
    "keydown",
    e => {

      if(e.code === "KeyW")
        keys.w = true;

      if(e.code === "KeyA")
        keys.a = true;

      if(e.code === "KeyS")
        keys.s = true;

      if(e.code === "KeyD")
        keys.d = true;

      if(e.code === "ShiftLeft" ||
         e.code === "ShiftRight")
        keys.shift = true;

      if(e.code === "KeyF")
        toggleFlashlight();

      if(e.code === "KeyE")
        interact();

      if(e.code === "KeyQ")
        openNearbyNote();

    }
  );

  window.addEventListener(
    "keyup",
    e => {

      if(e.code === "KeyW")
        keys.w = false;

      if(e.code === "KeyA")
        keys.a = false;

      if(e.code === "KeyS")
        keys.s = false;

      if(e.code === "KeyD")
        keys.d = false;

      if(e.code === "ShiftLeft" ||
         e.code === "ShiftRight")
        keys.shift = false;

    }
  );

  renderer.domElement.addEventListener(
    "click",
    () => {

      if(!gameStarted) return;

      renderer.domElement.requestPointerLock?.();

    }
  );

  document.addEventListener(
    "mousemove",
    e => {

      if(
        document.pointerLockElement !==
        renderer.domElement
      ) return;

      cameraYaw -=
        e.movementX *
        .0025 *
        sensitivity;

      cameraPitch -=
        e.movementY *
        .0025 *
        sensitivity;

      cameraPitch =
        THREE.MathUtils.clamp(
          cameraPitch,
          -1.35,
          1.35
        );

    }
  );

}

/* =====================================================
   MOBILE LAYOUT
===================================================== */

function isMobile(){

  return (
    "ontouchstart" in window ||
    navigator.maxTouchPoints > 0 ||
    window.innerWidth <= 900
  );

}

function updateMobileLayout(){

  if(!gameStarted) return;

  const mobile =
    isMobile();

  if(!mobile){

    $("mobileControls").style.display =
      "none";

    $("rotateScreen").style.display =
      "none";

    return;

  }

  const portrait =
    window.innerHeight >
    window.innerWidth;

  if(portrait){

    $("mobileControls").style.display =
      "none";

    $("rotateScreen").style.display =
      "flex";

  }else{

    $("rotateScreen").style.display =
      "none";

    $("mobileControls").style.display =
      "block";

  }

}

window.addEventListener(
  "resize",
  updateMobileLayout
);

window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      updateMobileLayout,
      150
    );

  }
);

/* =====================================================
   MOBILE CONTROLS
===================================================== */

function setupMobile(){

  const joystick =
    $("joystick");

  const knob =
    $("joystickKnob");

  const cameraZone =
    $("cameraZone");

  let joystickPointer =
    null;

  /* =====================
     JOYSTICK
  ===================== */

  joystick.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      joystickPointer =
        e.pointerId;

      joystick.setPointerCapture(
        e.pointerId
      );

      updateJoystick(
        e
      );

    }
  );

  joystick.addEventListener(
    "pointermove",
    e => {

      if(
        e.pointerId !==
        joystickPointer
      ) return;

      e.preventDefault();

      updateJoystick(
        e
      );

    }
  );

  function resetJoystick(){

    joy.x = 0;

    joy.y = 0;

    knob.style.transform =
      "translate(0px,0px)";

    joystickPointer = null;

  }

  joystick.addEventListener(
    "pointerup",
    resetJoystick
  );

  joystick.addEventListener(
    "pointercancel",
    resetJoystick
  );

  joystick.addEventListener(
    "lostpointercapture",
    resetJoystick
  );

  /* =====================
     CAMERA DRAG
  ===================== */

  let cameraPointer = null;

  let lastX = 0;
  let lastY = 0;

  cameraZone.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      cameraPointer =
        e.pointerId;

      lastX = e.clientX;
      lastY = e.clientY;

      cameraZone.setPointerCapture(
        e.pointerId
      );

    }
  );

  cameraZone.addEventListener(
    "pointermove",
    e => {

      if(
        e.pointerId !==
        cameraPointer
      ) return;

      e.preventDefault();

      const dx =
        e.clientX - lastX;

      const dy =
        e.clientY - lastY;

      lastX = e.clientX;
      lastY = e.clientY;

      cameraYaw -=
        dx *
        .008 *
        sensitivity;

      cameraPitch -=
        dy *
        .008 *
        sensitivity;

      cameraPitch =
        THREE.MathUtils.clamp(
          cameraPitch,
          -1.35,
          1.35
        );

    }
  );

  cameraZone.addEventListener(
    "pointerup",
    () => {

      cameraPointer = null;

    }
  );

  cameraZone.addEventListener(
    "pointercancel",
    () => {

      cameraPointer = null;

    }
  );

  /* =====================
     RUN
  ===================== */

  const run =
    $("runButton");

  function runStart(e){

    e.preventDefault();

    player.running = true;

  }

  function runStop(e){

    e.preventDefault();

    player.running = false;

  }

  run.addEventListener(
    "pointerdown",
    runStart
  );

  run.addEventListener(
    "pointerup",
    runStop
  );

  run.addEventListener(
    "pointercancel",
    runStop
  );

  run.addEventListener(
    "pointerleave",
    runStop
  );

  /* =====================
     FLASHLIGHT
  ===================== */

  $("flashButton")
    .addEventListener(
      "pointerdown",
      e => {

        e.preventDefault();

        toggleFlashlight();

      }
    );

  /* =====================
     INTERACT
  ===================== */

  $("interactButton")
    .addEventListener(
      "pointerdown",
      e => {

        e.preventDefault();

        interact();

      }
    );

  /* =====================
     NOTE
  ===================== */

  $("noteButton")
    .addEventListener(
      "pointerdown",
      e => {

        e.preventDefault();

        openNearbyNote();

      }
    );

  /* =====================
     SOUND
  ===================== */

  $("soundButton")
    .addEventListener(
      "pointerdown",
      e => {

        e.preventDefault();

        if(audioContext){

          if(
            audioContext.state ===
            "suspended"
          ){

            audioContext.resume();

          }

          soundTone(
            500,
            .1,
            .08
          );

        }

      }
    );

  /* =====================
     CAMERA BUTTONS
  ===================== */

  setupTurnButton(
    $("leftButton"),
    -1
  );

  setupTurnButton(
    $("rightButton"),
    1
  );

}

/* =====================================================
   JOYSTICK
===================================================== */

function updateJoystick(e){

  const joystick =
    $("joystick");

  const knob =
    $("joystickKnob");

  const rect =
    joystick.getBoundingClientRect();

  const centerX =
    rect.left +
    rect.width/2;

  const centerY =
    rect.top +
    rect.height/2;

  let dx =
    e.clientX -
    centerX;

  let dy =
    e.clientY -
    centerY;

  const max =
    rect.width/2 -
    34;

  const distance =
    Math.sqrt(
      dx*dx +
      dy*dy
    );

  if(distance > max){

    dx =
      dx/distance*max;

    dy =
      dy/distance*max;

  }

  joy.x =
    dx/max;

  joy.y =
    -dy/max;

  knob.style.transform =
    `translate(${dx}px,${dy}px)`;

}

/* =====================================================
   CAMERA BUTTON
===================================================== */

function setupTurnButton(
  button,
  direction
){

  let active = false;

  function loop(){

    if(!active) return;

    cameraYaw +=
      direction *
      .035 *
      sensitivity;

    requestAnimationFrame(
      loop
    );

  }

  button.addEventListener(
    "pointerdown",
    e => {

      e.preventDefault();

      active = true;

      loop();

    }
  );

  const stop =
    () => {

      active = false;

    };

  button.addEventListener(
    "pointerup",
    stop
  );

  button.addEventListener(
    "pointercancel",
    stop
  );

  button.addEventListener(
    "pointerleave",
    stop
  );

}

/* =====================================================
   FLASHLIGHT
===================================================== */

function toggleFlashlight(){

  if(battery <= 0){

    flashlightOn = false;

    flashlight.intensity = 0;

    return;

  }

  flashlightOn =
    !flashlightOn;

  flashlight.intensity =
    flashlightOn ? 4:0;

  soundTone(
    flashlightOn ? 650:300,
    .07,
    .05,
    "square"
  );

}

/* =====================================================
   INTERACT
===================================================== */

function interact(){

  const playerPos =
    camera.position;

  /* PICKUPS */

  for(
    let i=objects.length-1;
    i>=0;
    i--
  ){

    const obj =
      objects[i];

    if(!obj.parent) continue;

    const distance =
      playerPos.distanceTo(
        obj.position
      );

    if(distance < 2.2){

      if(
        obj.userData.pickup ===
        "key"
      ){

        obj.parent.remove(obj);

        player.key = true;

        pickupSound();

        showMessage(
          "ANAHTARI ALDIN",
          1800
        );

        return;

      }

      if(
        obj.userData.pickup ===
        "fuse"
      ){

        obj.parent.remove(obj);

        player.fuse = true;

        pickupSound();

        showMessage(
          "SİGORTAYI ALDIN",
          1800
        );

        return;

      }

      if(
        obj.userData.pickup ===
        "medkit"
      ){

        obj.parent.remove(obj);

        health =
          Math.min(
            100,
            health+35
          );

        pickupSound();

        showMessage(
          "CAN YENİLENDİ",
          1500
        );

        return;

      }

      if(
        obj.userData.pickup ===
        "battery"
      ){

        obj.parent.remove(obj);

        battery =
          Math.min(
            100,
            battery+40
          );

        pickupSound();

        showMessage(
          "FENER PİLİ DOLDU",
          1500
        );

        return;

      }

    }

  }

  /* DOORS */

  for(
    const d of doors
  ){

    const doorPos =
      new THREE.Vector3();

    d.pivot.getWorldPosition(
      doorPos
    );

    const distance =
      playerPos.distanceTo(
        doorPos
      );

    if(distance < 3){

      if(
        level === 0 &&
        !player.key
      ){

        showMessage(
          "KAPI KİLİTLİ — ANAHTAR GEREKİYOR",
          2000
        );

        return;

      }

      if(
        level === 1 &&
        !player.fuse
      ){

        showMessage(
          "PANEL ÇALIŞMIYOR — SİGORTA GEREKİYOR",
          2000
        );

        return;

      }

      d.target =
        d.target === 0 ?
        Math.PI/2:
        0;

      doorSound();

      return;

    }

  }

}

/* =====================================================
   NOTE
===================================================== */

function openNearbyNote(){

  if(
    $("notePanel").style.display ===
    "block"
  ){

    $("notePanel").style.display =
      "none";

    return;

  }

  let closest = null;

  let distance = Infinity;

  for(
    const note of noteObjects
  ){

    const d =
      camera.position.distanceTo(
        note.position
      );

    if(
      d < distance &&
      d < 3
    ){

      distance = d;

      closest = note;

    }

  }

  if(!closest){

    showMessage(
      "YAKINDA NOT YOK",
      1200
    );

    return;

  }

  currentNote =
    closest;

  $("noteText").textContent =
    closest.userData.note;

  $("notePanel").style.display =
    "block";

}

$("closeNote")
  .addEventListener(
    "click",
    () => {

      $("notePanel").style.display =
        "none";

    }
  );

/* =====================================================
   MOVEMENT
===================================================== */

function updatePlayer(dt){

  let forward = 0;
  let side = 0;

  if(keys.w)
    forward += 1;

  if(keys.s)
    forward -= 1;

  if(keys.d)
    side += 1;

  if(keys.a)
    side -= 1;

  forward += joy.y;

  side += joy.x;

  const moving =
    Math.abs(forward) > .05 ||
    Math.abs(side) > .05;

  let wantsRun =
    player.running ||
    keys.shift;

  let running =
    wantsRun &&
    moving &&
    stamina > 0;

  if(running){

    stamina -=
      dt * 28;

    stamina =
      Math.max(
        0,
        stamina
      );

  }else{

    stamina +=
      dt * 18;

    stamina =
      Math.min(
        100,
        stamina
      );

  }

  const speed =
    running ? 6.5:3.2;

  if(moving){

    const length =
      Math.sqrt(
        forward*forward +
        side*side
      );

    if(length > 1){

      forward /= length;
      side /= length;

    }

    const direction =
      new THREE.Vector3();

    direction.x =
      Math.sin(cameraYaw) *
      forward +
      Math.cos(cameraYaw) *
      side;

    direction.z =
      Math.cos(cameraYaw) *
      forward -
      Math.sin(cameraYaw) *
      side;

    const oldPosition =
      camera.position.clone();

    camera.position.x +=
      direction.x *
      speed *
      dt;

    camera.position.z +=
      direction.z *
      speed *
      dt;

    if(collides()){

      camera.position.copy(
        oldPosition
      );

    }

    footsteps(
      running
    );

  }else{

    stopFootsteps();

  }

  camera.position.y =
    1.65;

  camera.rotation.order =
    "YXZ";

  camera.rotation.y =
    cameraYaw;

  camera.rotation.x =
    cameraPitch;

}

/* =====================================================
   COLLISION
===================================================== */

function collides(){

  const radius =
    .35;

  for(
    const obj of objects
  ){

    if(
      !obj.userData.wall
    ) continue;

    const box =
      new THREE.Box3()
        .setFromObject(obj);

    if(
      camera.position.x >
        box.min.x-radius &&
      camera.position.x <
        box.max.x+radius &&
      camera.position.z >
        box.min.z-radius &&
      camera.position.z <
        box.max.z+radius
    ){

      return true;

    }

  }

  return false;

}

/* =====================================================
   DOORS UPDATE
===================================================== */

function updateDoors(){

  for(
    const d of doors
  ){

    d.pivot.rotation.y +=
      (d.target -
       d.pivot.rotation.y) *
      .12;

  }

}

/* =====================================================
   ENTITY
===================================================== */

function updateEntity(dt){

  if(!entity) return;

  const direction =
    new THREE.Vector3();

  direction.subVectors(
    camera.position,
    entity.position
  );

  direction.y = 0;

  const distance =
    direction.length();

  if(distance < 15){

    direction.normalize();

    entity.rotation.y =
      Math.atan2(
        direction.x,
        direction.z
      );

    if(distance > 2){

      entity.position.x +=
        direction.x *
        dt *
        1.5;

      entity.position.z +=
        direction.z *
        dt *
        1.5;

    }

    if(distance < 1.5){

      jumpscare();

    }

  }

}

/* =====================================================
   JUMPSCARE
===================================================== */

let scareActive = false;

function jumpscare(){

  if(scareActive) return;

  scareActive = true;

  jumpscareSound();

  $("jumpscare").style.display =
    "flex";

  setTimeout(
    () => {

      $("jumpscare").style.display =
        "none";

      health = 0;

      die();

    },
    800
  );

}

/* =====================================================
   DEATH
===================================================== */

function die(){

  stopFootsteps();

  $("deathScreen").style.display =
    "flex";

}

$("restartButton")
  .addEventListener(
    "click",
    () => {

      $("deathScreen").style.display =
        "none";

      health = 100;

      stamina = 100;

      battery = 100;

      player = {

        running:false,
        hidden:false,
        key:false,
        fuse:false

      };

      scareActive = false;

      buildLevel(level);

    }
  );

/* =====================================================
   BATTERY
===================================================== */

function updateBattery(dt){

  if(
    flashlightOn
  ){

    battery -=
      dt * 3;

    if(battery <= 0){

      battery = 0;

      flashlightOn = false;

      flashlight.intensity =
        0;

    }

  }

}

/* =====================================================
   EXIT
===================================================== */

function checkExit(){

  if(
    camera.position.z <
    -18
  ){

    if(level === 0){

      if(player.key){

        buildLevel(1);

        showMessage(
          "LEVEL 1 — SIGORTAYI BUL",
          3000
        );

      }

    }

    else if(level === 1){

      if(player.fuse){

        buildLevel(2);

        showMessage(
          "LEVEL 2 — SON KAPI",
          3000
        );

      }

    }

    else if(level === 2){

      showMessage(
        "ÇIKIŞI BULDUN!",
        5000
      );

    }

  }

}

/* =====================================================
   HUD
===================================================== */

function updateHUD(){

  $("healthBar").style.width =
    health + "%";

  $("staminaBar").style.width =
    stamina + "%";

  $("batteryBar").style.width =
    battery + "%";

}

/* =====================================================
   MESSAGE
===================================================== */

let messageTimer = null;

function showMessage(
  text,
  duration=2000
){

  $("message").textContent =
    text;

  clearTimeout(
    messageTimer
  );

  messageTimer =
    setTimeout(
      () => {

        $("message").textContent =
          "";

      },
      duration
    );

}

/* =====================================================
   RESIZE
===================================================== */

function onResize(){

  if(!camera || !renderer)
    return;

  camera.aspect =
    innerWidth /
    innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

}

/* =====================================================
   ANIMATION
===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );

  if(
    !gameStarted ||
    !camera ||
    !renderer
  ){

    return;

  }

  const dt =
    Math.min(
      clock.getDelta(),
      .05
    );

  updatePlayer(dt);

  updateDoors();

  updateEntity(dt);

  updateBattery(dt);

  updateHUD();

  checkExit();

  if(
    health <= 0
  ){

    die();

  }

  renderer.render(
    scene,
    camera
  );

}
